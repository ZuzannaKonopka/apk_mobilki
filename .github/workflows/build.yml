name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild -project PhotoLexicon.xcodeproj -target PhotoLexicon \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build
      - run: zip -r xcodeproj.zip PhotoLexicon.xcodeproj -x"*/xcuserdata/*"
      - uses: actions/upload-artifact@v4
        with:
          name: xcodeproj
          path: xcodeproj.zip
          
